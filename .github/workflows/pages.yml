name: Build and deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node scripts/check-example-query.mjs
      - run: python3 scripts/check-sql-null.py
      - run: python3 scripts/check-group-ledger.py
      - run: python3 -m unittest discover -s tests -p coverage_rows_test.py
      - run: python3 -m unittest discover -s tests -p assessment_static_graph_test.py
      - run: python3 -m unittest discover -s tests -p adventure_coverage_join_test.py
      - run: python3 scripts/coverage_rows.py
      - run: python3 scripts/coverage_inventory.py --check docs/curriculum-inventory-draft.csv --audit docs/curriculum-audits.json --assessments docs/curriculum-assessments.json
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
          name: github-pages-${{ github.run_attempt }}
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
          timeout: 1200000
